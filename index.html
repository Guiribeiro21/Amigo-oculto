<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Amigo Oculto</title>
<style>
:root{--bg:#f2f9f8;--card:#fff;--ink:#16322f;--mut:#5d7c78;--acc:#018982;--acc2:#d6361f;--line:#d5e8e5;--on:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1c1b;--card:#162a28;--ink:#e8f5f3;--mut:#9bbcb7;--acc:#2bb5ab;--acc2:#ff6a52;--line:#274542;--on:#08201e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1c1b;--card:#162a28;--ink:#e8f5f3;--mut:#9bbcb7;--acc:#2bb5ab;--acc2:#ff6a52;--line:#274542;--on:#08201e;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
main{max-width:920px;margin:0 auto;padding:24px 16px 48px}
header{text-align:center;margin-bottom:20px}
h1{margin:0;font-size:clamp(1.8rem,5vw,2.6rem);color:var(--acc)}
.logo{width:84px;height:84px;border-radius:50%;background:#fff;display:block;margin:0 auto 12px}
.sub{color:var(--mut);margin:6px 0 0}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
input{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
input.grow{flex:1}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:var(--acc);color:var(--on)}
button.ghost{background:transparent;color:var(--mut);border:1px solid var(--line)}
button.x{background:transparent;color:var(--mut);padding:2px 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--acc2);border-radius:16px;padding:16px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.av{width:40px;height:40px;border-radius:50%;background:var(--acc);color:var(--on);display:grid;place-items:center;font-weight:700;flex:none}
.name{font-weight:700;font-size:1.1rem;flex:1}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:6px;padding:6px 0;border-top:1px dashed var(--line)}
li span{flex:1}
.empty{color:var(--mut);font-style:italic}
.add{display:flex;gap:6px;margin-top:10px}
.add input{flex:1}
.note{font-size:.85rem;color:var(--mut);text-align:center;margin-top:24px}
</style>
</head>

let editing = false, art = null, filter = '', timer = null;
const app = document.getElementById('app');

function el(tag, cls, text){ const e = document.createElement(tag); if(cls) e.className = cls; if(text != null) e.textContent = text; return e; }

function save(){
  if(!art) return;
  clearTimeout(timer);
  timer = setTimeout(async () => {
    try{
      const c = document.documentElement.cloneNode(true);
      c.querySelector('#app').innerHTML = '';
      c.querySelector('#data').textContent = JSON.stringify(state).replace(/</g, '\\u003c');
      await art.publish('<!doctype html>\n' + c.outerHTML);
    }catch(e){ console.error(e); }
  }, 600);
}

function render(){
  app.innerHTML = '';
  const h = el('header');
  const lg = el('img', 'logo'); lg.src = LOGO; lg.alt = 'Logo da empresa';
  h.append(lg, el('h1', '', state.title), el('p', 'sub', state.info));
  app.append(h);

  const bar = el('div', 'bar');
  const search = el('input', 'grow'); search.placeholder = 'Buscar participante…'; search.value = filter;
  search.oninput = () => { filter = search.value; renderGrid(); };
  bar.append(search);
  if(art){
    const t = el('button', editing ? '' : 'ghost', editing ? 'Concluir edição' : 'Editar lista');
    t.onclick = () => { editing = !editing; render(); };
    bar.append(t);
  }
  app.append(bar);

  if(editing){
    const row = el('div', 'bar');
    const n = el('input', 'grow'); n.placeholder = 'Nome do novo participante';
    const b = el('button', '', 'Adicionar');
    b.onclick = () => { const v = n.value.trim(); if(!v) return; state.people.push({name:v, wishes:[]}); save(); render(); };
    row.append(n, b);
    app.append(row);
  }

  const grid = el('div', 'grid'); grid.id = 'grid';
  app.append(grid, el('p', 'note', 'O resultado do sorteio não aparece aqui: cada pessoa já sabe quem tirou. 🤫'));
  renderGrid();
}

function renderGrid(){
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  const q = filter.trim().toLowerCase();
  state.people.forEach((p, i) => {
    if(q && !p.name.toLowerCase().includes(q)) return;
    const card = el('div', 'card');
    const top = el('div', 'top');
    top.append(el('div', 'av', p.name.charAt(0).toUpperCase()), el('div', 'name', p.name));
    if(editing){
      const d = el('button', 'x', '🗑');
      d.title = 'Remover participante';
      d.onclick = () => { if(confirm('Remover ' + p.name + '?')){ state.people.splice(i, 1); save(); render(); } };
      top.append(d);
    }
    card.append(top);
    if(!p.wishes.length) card.append(el('p', 'empty', 'Ainda sem desejos cadastrados.'));
    const ul = el('ul');
    p.wishes.forEach((w, j) => {
      const li = el('li'); li.append(el('span', '', '• ' + w));
      if(editing){
        const x = el('button', 'x', '✕'); x.title = 'Remover desejo';
        x.onclick = () => { p.wishes.splice(j, 1); save(); renderGrid(); };
        li.append(x);
      }
      ul.append(li);
    });
    card.append(ul);
    if(editing){
      const add = el('div', 'add');
      const inp = el('input'); inp.placeholder = 'Novo desejo';
      const b = el('button', '', '+');
      const go = () => { const v = inp.value.trim(); if(!v) return; p.wishes.push(v); save(); renderGrid(); };
      b.onclick = go; inp.onkeydown = e => { if(e.key === 'Enter') go(); };
      add.append(inp, b); card.append(add);
    }
    grid.append(card);
  });
}

render();
(async () => {
  try{
    if(window.claude && claude.use){
      const a = await claude.use('artifact');
      const u = await claude.use('user');
      if(a && u && u.canEdit()){ art = a; render(); }
    }
  }catch(e){}
})();
</script>
